<ion-content class="login-bg">
  <div class="login-container">
    <ion-card class="login-card">

      <div class="theme-toggle">
        <ion-button fill="clear" size="small" (click)="toggleDarkMode()">
          <ion-icon name="moon-outline" slot="icon-only"></ion-icon>
        </ion-button>
      </div>

      <ion-card-header>
        <ion-card-title>Crear Cuenta</ion-card-title>
        <ion-card-subtitle>
          ¿Ya tienes cuenta? <span class="link" (click)="irALogin()">Inicia sesión</span>
        </ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <div class="input-group">
          <ion-input [(ngModel)]="correo"
                     label="Correo o Usuario"
                     labelPlacement="stacked"
                     fill="outline"
                     placeholder="Ingresa tu correo">
          </ion-input>
        </div>

        <div class="input-group">
          <ion-input [(ngModel)]="pass"
                     type="password"
                     label="Contraseña"
                     labelPlacement="stacked"
                     fill="outline"
                     placeholder="********">
          </ion-input>
        </div>

        <ion-button expand="block" shape="round" class="submit-btn" (click)="crearCuenta()">
          Registrarse en el Juego
        </ion-button>
      </ion-card-content>

    </ion-card>
  </div>
</ion-content>
