<ion-content>
  <div class="signup-wrapper">
    <div class="glass-card">

   
      <!-- Título principal -->
      <div style="text-align: center; margin-bottom: 24px;">
        <h1 style="font-size: 26px; font-weight: 700; margin: 0 0 6px 0;">Crear Cuenta</h1>
        <p style="font-size: 14px; color: #bbb; margin: 0;">
          ¿Ya tienes cuenta? <span (click)="irALogin()" style="color: #3880ff; cursor: pointer; text-decoration: underline;">Inicia sesión</span>
        </p>
      </div>

      <!-- Formulario de Registro -->
      <div *ngIf="!verificarCorreo">
        <ion-item style="--background: rgba(255,255,255,0.08); --border-radius: 12px; margin-bottom: 14px; color: #fff;">
          <ion-input label="Nombre" labelPlacement="stacked" [(ngModel)]="nombre" placeholder="Tu nombre"></ion-input>
        </ion-item>

        <ion-item style="--background: rgba(255,255,255,0.08); --border-radius: 12px; margin-bottom: 14px; color: #fff;">
          <ion-input label="Correo Electrónico" labelPlacement="stacked" [(ngModel)]="correo" placeholder="correo@ejemplo.com" type="email"></ion-input>
        </ion-item>

        <ion-item style="--background: rgba(255,255,255,0.08); --border-radius: 12px; margin-bottom: 20px; color: #fff;">
          <ion-input label="Contraseña" labelPlacement="stacked" [(ngModel)]="contrasena" placeholder="********" type="password"></ion-input>
        </ion-item>

        <!-- Mensaje de Error -->
        <p *ngIf="error" style="color: #ff4961; text-align: center; font-size: 13px; margin-bottom: 12px;">{{ error }}</p>

        <!-- Sugerencias de Nombres -->
        <div *ngIf="sugerenciasNombres && sugerenciasNombres.length > 0" style="text-align: center; margin-bottom: 15px;">
          <p style="font-size: 12px; margin-bottom: 6px; color: #ddd;">¿Te gustaría usar alguno de estos nombres?</p>
          <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;">
            <ion-chip *ngFor="let sug of sugerenciasNombres" (click)="usarSugerencia(sug)" style="background: rgba(255,255,255,0.2); color: #fff; cursor: pointer;">
              <ion-label>{{ sug }}</ion-label>
            </ion-chip>
          </div>
        </div>

        <!-- Botón de Registro -->
        <ion-button expand="block" (click)="registrar()" [disabled]="cargando" style="height: 48px; font-weight: 700; --border-radius: 12px;">
          {{ cargando ? 'REGISTRANDO...' : 'REGISTRARSE EN EL JUEGO' }}
        </ion-button>
      </div>

    </div>
  </div>
</ion-content>
