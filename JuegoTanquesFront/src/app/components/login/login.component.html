<ion-content class="login-bg">
  <div class="login-container">
    <ion-card class="login-card">

      <!-- Botón para alternar modo oscuro -->
      <div class="theme-toggle">
        <ion-button fill="clear" size="small" (click)="toggleDarkMode()">
          <ion-icon name="moon-outline" slot="icon-only"></ion-icon>
        </ion-button>
      </div>

      <!-- Encabezado de la Tarjeta -->
      <ion-card-header>
        <ion-card-title>Iniciar Sesión</ion-card-title>
        <ion-card-subtitle>
          ¿No tienes cuenta? <span class="link" (click)="irARegistro()">Regístrate</span>
        </ion-card-subtitle>
      </ion-card-header>

      <!-- Contenido / Formulario -->
      <ion-card-content>
        <!-- Campo de Correo / Usuario -->
        <div class="input-group">
          <ion-input [(ngModel)]="correo"
                     label="Correo o Usuario"
                     labelPlacement="stacked"
                     fill="outline"
                     placeholder="Ingresa tu usuario">
          </ion-input>
        </div>

        <!-- Campo de Contraseña -->
        <div class="input-group">
          <ion-input [(ngModel)]="pass"
                     type="password"
                     label="Contraseña"
                     labelPlacement="stacked"
                     fill="outline"
                     placeholder="********">
          </ion-input>
        </div>

        <!-- Botón de Ingresar -->
        <ion-button expand="block" shape="round" class="submit-btn" (click)="iniciarSesion()">
          Ingresar al Juego
        </ion-button>
      </ion-card-content>

    </ion-card>
  </div>
</ion-content>
