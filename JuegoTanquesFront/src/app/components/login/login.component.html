<ion-content>
  <div class="login-container">
    <div class="login-card">



      <!-- Títulos y enlace de registro -->
      <div style="text-align: center; margin-bottom: 24px;">
        <h1 style="font-size: 26px; font-weight: 700; margin: 0 0 6px 0;">Iniciar Sesión</h1>
        <p style="font-size: 14px; color: #bbb; margin: 0;">
          ¿No tienes cuenta? <span (click)="irARegistro()" style="color: #3880ff; cursor: pointer; text-decoration: underline;">Registrate</span>
        </p>
      </div>

      <!-- Formulario -->
      <div>
        <div class="input-group">
          <ion-item>
            <ion-input [(ngModel)]="correo" label="Correo o Usuario" labelPlacement="stacked" placeholder="Ingresa tu usuario"></ion-input>
          </ion-item>
        </div>

        <div class="input-group">
          <ion-item>
            <ion-input [(ngModel)]="contrasena" type="password" label="Contraseña" labelPlacement="stacked" placeholder="********"></ion-input>
          </ion-item>
        </div>

        <ion-text color="danger" *ngIf="error">
          <p style="font-size: 0.85rem; margin-top: 5px; text-align: center;">{{ error }}</p>
        </ion-text>

        <ion-button expand="block" class="submit-btn" (click)="ingresar()" [disabled]="cargando">
          {{ cargando ? 'Ingresando...' : 'INGRESAR AL JUEGO' }}
        </ion-button>
      </div>

    </div>
  </div>
</ion-content>
