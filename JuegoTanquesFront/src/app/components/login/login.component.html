<ion-content>
  <!-- Contenedor principal que divide la pantalla en dos columnas -->
  <div class="login-container">

    <!-- COLUMNA IZQUIERDA: Imagen o banner decorativo -->
    <div class="login-banner">
      <div class="banner-content">
        <h2>Juego de Tanques</h2>
        <p>Prepárate para la batalla en línea.</p>
      </div>
    </div>

    <!-- COLUMNA DERECHA: El Formulario de Login -->
    <div class="login-form-section">

      <!-- Botón para cambiar a modo oscuro (arriba a la derecha o donde prefieras) -->
      <div class="theme-toggle-container">
        <ion-button fill="clear" (click)="toggleDarkMode()">
          <ion-icon name="moon-outline" slot="icon-only"></ion-icon>
        </ion-button>
      </div>

      <div class="form-wrapper">
        <h1>Iniciar Sesión</h1>
        <p class="subtitle">¿No tienes cuenta? <span class="link">Regístrate</span></p>

        <!-- Campo de Correo / Usuario -->
        <ion-item class="custom-input">
          <ion-input label="Correo o Usuario" labelPlacement="stacked" placeholder="Ingresa tu usuario"></ion-input>
        </ion-item>

        <!-- Campo de Contraseña -->
        <ion-item class="custom-input">
          <ion-input type="password" label="Contraseña" labelPlacement="stacked" placeholder="********"></ion-input>
        </ion-item>

        <!-- Botón de Ingresar -->
        <ion-button expand="block" class="submit-btn">Ingresar al Juego</ion-button>
      </div>

    </div>

  </div>
</ion-content>
